base:
  random_state: 42
  raw_data_path: "data/raw"

mediapipe:
  model_complexity: 1
  min_detection_confidence: 0.3
  min_tracking_confidence: 0.3

# --- POSE PIPELINE (Formerly "Normalized") ---
pose_pipeline:
  data_path: "data/Data_Normalized"
  model_path: "models/lstm_pose.h5"
  sequence_length: 40
  stride: 5
  batch_size: 16
  epochs: 80
  crop_config: 
    top: 0.10
    bottom: 0.45
    left: 0.25
    right: 0.25

# --- HYBRID PIPELINE (TCN) ---
hybrid_pipeline:
  data_path: "data/Data_Normalized_Hybrid"
  model_path: "models/tcn_hybrid.h5"
  sequence_length: 40
  stride: 5
  batch_size: 8
  epochs: 120
  cnn_feature_dim: 64
  crop_config:
    top: 0.10
    bottom: 0.45
    left: 0.25
    right: 0.25

# --- EXPERT TEMPLATES ---
expert_pipeline:
  raw_path: "data/expert_data"
  output_path: "data/expert_templates.npz"

ksi:
  weights:
    pose: 0.4
    velocity: 0.4
    acceleration: 0.2