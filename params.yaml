base:
  random_state: 42
  raw_data_path: "data/raw"

mediapipe:
  model_complexity: 1
  min_detection_confidence: 0.3
  min_tracking_confidence: 0.3

# --- POSE PIPELINE (Formerly "Normalized") ---
pose_pipeline:
  data_path: "data/Data_Normalized"
  model_path: "models/lstm_pose.h5"
  sequence_length: 40
  stride: 5
  batch_size: 16
  epochs: 80
  crop_config: 
    top: 0.13
    bottom: 0.35
    left: 0.25
    right: 0.25

# --- HYBRID PIPELINE (TCN) - PRODUCTION MODEL ---
hybrid_pipeline:
  data_path: "data/Data_Normalized_Hybrid"
  model_path: "models/tcn_hybrid_tuned.h5"  # Production: Optuna-tuned model
  sequence_length: 40
  stride: 5
  batch_size: 8
  epochs: 250
  cnn_feature_dim: 64
  cnn_input_size: 224
  cnn_roi:
    enabled: true
    # MediaPipe pose landmark indices used to localize the action region.
    # Full-body: shoulders (11-12), elbows (13-14), wrists (15-16),
    #            hips (23-24), knees (25-26), ankles (27-28).
    joint_ids: [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]
    visibility_thresh: 0.3      # ignore joints with visibility < this
    min_joints: 4               # fallback if fewer joints detected
    margin: 0.35                # expand box by 35% on each side
    min_size_frac: 0.65         # box is at least 65% of frame size
    smoothing: 0.3              # EMA smoothing towards previous box (0=none)
    fallback_full_frame: true   # use full frame if pose is missing/noisy
    use_last_box_on_missing_pose: true
  crop_config:
    top: 0.13
    bottom: 0.35
    left: 0.25
    right: 0.25

# --- EXPERT TEMPLATES ---
expert_pipeline:
  raw_path: "data/expert_data"
  output_path: "data/expert_templates.npz"

ksi:
  weights:
    pose: 0.4
    velocity: 0.4
    acceleration: 0.2

# --- SEGMENT RULES ---
# Controls which part of the clip is processed
segment_rules:
  default_seconds: 1.75   # fallback window (tail)
  tail_seconds: 2.0       # tail window for listed shots
  tail_shots:
    - forehand_clear
  middle_shots:           # shot -> seconds (centered window)
    forehand_lift: 2.0

# --- CROP OVERRIDES (By video number) ---
# Applies only when cropping is enabled (i.e., not files like "name (N).mp4").
# Rules are matched by shot folder name (path component) and the leading video number.
# If multiple ranges match, the last matching range wins.
crop_overrides:
  forehand_drive:
    - { start: 1, end: 24, bottom: 0.50 }
    - { start: 24, end: 42, bottom: 0.45 }
    - { start: 42, end: 58, bottom: 0.40 }
    - { start: 58, end: 88, bottom: 0.40 }
    - { start: 88, end: 100, bottom: 0.50 }

  backhand_drive:
    - { start: 1, end: 38, bottom: 0.45 }
    - { start: 38, end: 100, bottom: 0.40 }

  backhand_net_shot:
    - { start: 1, end: 6, bottom: 0.50 }
    - { start: 7, end: 34, bottom: 0.40 }
    - { start: 35, end: 44, bottom: 0.35 }
    - { start: 45, end: 70, bottom: 0.45 }
    - { start: 71, end: 100, bottom: 0.35 }

  forehand_clear:
    - { start: 1, end: 27, bottom: 0.48 }
    - { start: 28, end: 98, bottom: 0.40 }
    - { start: 99, end: 100, bottom: 0.45 }

  forehand_lift:
    - { start: 1, end: 25, bottom: 0.40 }
    - { start: 26, end: 38, bottom: 0.45 }
    - { start: 39, end: 47, bottom: 0.37 }
    - { start: 48, end: 59, bottom: 0.40 }
    - { start: 60, end: 72, bottom: 0.45 }
    - { start: 73, end: 100, bottom: 0.37 }

  forehand_net_shot:
    - { start: 1, end: 11, bottom: 0.50 }
    - { start: 11, end: 42, bottom: 0.40 }
    - { start: 43, end: 51, bottom: 0.37 }
    - { start: 52, end: 63, bottom: 0.40 }
    - { start: 64, end: 67, bottom: 0.43 }
    - { start: 68, end: 100, bottom: 0.35 }
# --- MLFLOW CONFIGURATION ---
mlflow:
  tracking_uri: "file:./mlruns"  # Local tracking (or set to remote server URI)
  artifact_location: "./mlartifacts"
  enable_system_metrics: true
  log_models_to_registry: true
  auto_name_runs: false  # Set to true to skip interactive prompts (auto-generate names)

