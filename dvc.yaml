stages:
  # --- EXPERT DATA TEMPLATES ---
  generate_templates:
    cmd: python src/generate_templates.py
    deps:
    - src/generate_templates.py
    - src/ksi_v2.py
    - src/features.py
    - data/expert_data
    params:
    - expert_pipeline
    - mediapipe
    outs:
    - data/expert_templates.npz

  # --- PRODUCTION PIPELINE (TCN HYBRID TUNED) ---
  # Note: Run `dvc repro preprocess_production -f` to regenerate data with raw landmarks for KSI
  preprocess_production:
    cmd: python src/preprocess_hybrid.py
    deps:
    - src/preprocess_hybrid.py
    - src/features.py
    - src/utils.py
    - data/raw
    params:
    - hybrid_pipeline
    - mediapipe
    - segment_rules
    - crop_overrides
    outs:
    - data/Data_Normalized_Hybrid:
        persist: true

  evaluate_production:
    cmd: python src/evaluate.py --type hybrid --model models/tcn_hybrid_tuned.h5
    deps:
    - src/evaluate.py
    - models/tcn_hybrid_tuned.h5
    - data/Data_Normalized_Hybrid
    - data/expert_templates.npz
    metrics:
    - dvclive/production_metrics.json:
        cache: false
    plots:
    - dvclive/production_confusion_matrix.png:
        cache: false
metrics:
- dvclive/metrics.json
plots:
- dvclive/plots/metrics:
    x: step
